
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Site Not Found</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f8fafc;
      color: #172033;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .error { max-width: 560px; }
    h1 {
      margin: 0;
      font-size: clamp(64px, 15vw, 110px);
      letter-spacing: -5px;
      color: #dc2626;
    }
    h2 { font-size: 25px; margin: 8px 0 14px; }
    p { color: #64748b; line-height: 1.7; }
  </style>
</head>
<body>
  <main class="error">
    <h1>404</h1>
    <h2>Site Not Found</h2>
    <p>The website you are trying to access is currently unavailable or may have been moved.</p>
  </main>
</body>
</html>
